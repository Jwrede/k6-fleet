name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ['1.23', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/k6-fleet
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        k6: ['v2.3.0', 'v1.8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${{ matrix.k6 }}/k6-${{ matrix.k6 }}-linux-amd64.tar.gz" | tar xz
          sudo mv "k6-${{ matrix.k6 }}-linux-amd64/k6" /usr/local/bin/k6
          k6 version
      - name: Enable ssh to this host
        run: |
          sudo apt-get install -y -qq openssh-server
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          ssh-keyscan -H localhost 127.0.0.1 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run against real k6
        env:
          K6FLEET_E2E: '1'
          K6FLEET_E2E_CHROME: google-chrome
          K6FLEET_E2E_SHOTS: ${{ runner.temp }}/shots
          K6FLEET_E2E_DOCKER_IMAGE: grafana/k6:${{ matrix.k6 == 'v2.3.0' && '2.3.0' || '1.8.2' }}
          K6FLEET_E2E_SSH: localhost,127.0.0.1
          K6FLEET_E2E_REPORT: ${{ runner.temp }}/report.html
        run: |
          mkdir -p "$K6FLEET_E2E_SHOTS"
          go test -v -timeout 15m ./e2e/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.k6 }}
          path: |
            ${{ runner.temp }}/report.html
            ${{ runner.temp }}/shots
          if-no-files-found: ignore
